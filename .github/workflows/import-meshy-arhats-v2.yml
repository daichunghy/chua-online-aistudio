      - name: Validate GLB files and write asset manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path("models/arhats").glob("*.glb"))
          assert len(files) == 18, f"Expected 18 GLBs, found {len(files)}"
          for path in files:
              data = path.read_bytes()
              assert len(data) > 10000, f"{path} is unexpectedly small"
              assert data[:4] == b"glTF", f"{path} is not a GLB"
          print(f"Validated {len(files)} textured GLB models")
          PY
          cat > models/arhats/README.md <<'EOF'
          # Bộ 18 vị La Hán — Chùa Vĩnh Tràng

          18 mô hình GLB được tạo riêng cho game, theo bộ tượng gỗ mít thếp vàng và các linh thú trong tư liệu về chùa Vĩnh Tràng. Mỗi model có hình học tối ưu cho game (meshy-t2, khoảng 6.000 mặt) và vật liệu PBR 2K (meshy-7).

          Thứ tự file khớp với EIGHTEEN_ARHATS và ARHAT_GLB_PATHS trong mã nguồn. Tổng chiều cao trong game được fit về khoảng 0,8 m; plinth thấp nằm trong từng model.
          EOF
      - name: Commit model assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/import-meshy-arhats.yml
          git rm .github/workflows/import-meshy-arhats-v2.yml
          git add models/arhats
          git commit -m "Add 18 textured Vinh Trang Arhat GLB models"
          git pull --rebase origin main
          git push origin HEAD:main
