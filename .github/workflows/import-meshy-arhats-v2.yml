name: Import selected Vinh Trang Arhat assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-meshy-arhats-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate game module syntax
        run: node --check src/app/vinh-trang-3d-world.mjs

      - name: Download three selected GLB assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "Mô hình 3D Vĩnh Tràng/Tượng"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 600 'https://assets.meshy.ai/uploads/converted/01a1e119-61e7-7458-a668-37d75f6d3c76/01a1e11c-a95a-7358-a00a-48db6f578370/Meshy_AI_Single_complete_Vinh__1115212834_texture.glb?Expires=1794873600&Signature=ckkp-44MyHRL15u3kxi6fY7hIcJEJC4EZlILnxJcruiy4oaQUXfjdYu~KFdXyZo52LFyKkIgJzzbIos9brtyuLh0qMhCOK5QuPDcYdwxiq3~9iaCzUdNBzTJKawVIC~W1gUCSUVocf9AqNCdgI2PdLdbXkwvkHFWaPIRc2amSHcsBRkHCcQXUpYaOYg-iugtbsEvavF4pTNtJoayVp9purBe~diII8NmyispbHesLcssvWFMCGljH1fic51uMCcBqMSDj7cpfeRE3gFMnXDG2E-pBXeIaJi6K7m79pJqWQ7o8t-x-G3dRCrCrRnOfqdtCvXk8oV-0Am7IjM8jlU9yg__&Key-Pair-Id=K1VGYTHIYLM9UM' --output "Mô hình 3D Vĩnh Tràng/Tượng/ky-tuong-la-han.glb"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 600 'https://assets.meshy.ai/uploads/converted/01a1e115-015f-72f1-ad39-a97f50defe78/01a1e115-fe8e-726b-aac9-9daf3c25b90e/Meshy_AI_Single_complete_Vinh__1115212117_texture.glb?Expires=1794873600&Signature=hiqDYuh53wg~kfHtGJTBcgZ7-9vlkJeURuybScWH1X97X5TbW4vewOet1LZipxNows5HQm1WK2ag4AiM739uuj6XHYFP5lF2BDv~BvrCILF33g8Yg0MzmAHVmLi1tjD-OGIlLCbWz1KuAROsS~039YOFnK1OafmEkOyXQFODYPp4zS1VbxagE7UlEOC9ZQA~KCmJi0PeQLq4xTV9-quXFlPb2OqRu6ebQfW~mjuBX2smNMJ85rT1R00DBdY60kGBYABDmKCNq6UysGnItgPweHYb~OQNqftltmYVoymSwF9-xLVPVHYaqERzIffmsGWW7K124mrhgy-CBrk5GzPesw__&Key-Pair-Id=K1VGYTHIYLM9UM' --output "Mô hình 3D Vĩnh Tràng/Tượng/toa-loc-la-han.glb"
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 600 'https://assets.meshy.ai/uploads/converted/01a1e10e-533c-7604-a0df-6b5ecce0aed3/01a1e10f-7e12-74a8-aa6e-774a481485af/Meshy_AI_Single_complete_3D_st_1115211411_texture.glb?Expires=1794873600&Signature=LfUK1ZNcDoPgZfl4rQNWOTRfetXPTXKxauF3cqVmhLGKyCN5Qqr2xhNal6oOERHdNcutIKsHFuFdWV-iEWmiONVPbTq2~ECdxN-J5Rm~R5DunKOVYGYa-Ac1rPVme9IlPxlWnvrdZOwGLdlkRXKlbiA2AQyZ4AgPq~Qu64xybeabNf0MrJ8hi-1UDneBZzrlYggSZd~ApnJ03rc6zKE--m6aJxWsLmwKAG6CzW49ymVqjXkvr1-bkiGMoOKHSFAmDcKs7HUu1t4msjz7yhK8vrh~ckle6~e1iCBXCJiWq6GwAqGho-3tutL333VJBWo7rCow9qorYtsN~zF3reIWAQ__&Key-Pair-Id=K1VGYTHIYLM9UM' --output "Mô hình 3D Vĩnh Tràng/Tượng/phuc-ho-la-han.glb"

      - name: Validate GLB containers and texture resolution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          import io
          import json
          import struct
          from pathlib import Path
          from PIL import Image

          root = Path("Mô hình 3D Vĩnh Tràng/Tượng")
          names = ["ky-tuong-la-han.glb", "toa-loc-la-han.glb", "phuc-ho-la-han.glb"]
          for name in names:
              path = root / name
              data = path.read_bytes()
              assert data[:4] == b"glTF", f"{name}: invalid GLB magic"
              version, declared_length = struct.unpack_from("<II", data, 4)
              assert version == 2 and declared_length == len(data), f"{name}: invalid GLB header"
              json_length, json_type = struct.unpack_from("<II", data, 12)
              assert json_type == 0x4E4F534A, f"{name}: missing JSON chunk"
              doc = json.loads(data[20:20 + json_length].decode("utf-8").rstrip(" \\0"))
              bin_header = 20 + json_length
              bin_length, bin_type = struct.unpack_from("<II", data, bin_header)
              assert bin_type == 0x004E4942, f"{name}: missing binary chunk"
              binary = data[bin_header + 8:bin_header + 8 + bin_length]
              dimensions = []
              for image in doc.get("images", []):
                  if "bufferView" not in image:
                      continue
                  view = doc["bufferViews"][image["bufferView"]]
                  start = view.get("byteOffset", 0)
                  raw = binary[start:start + view["byteLength"]]
                  with Image.open(io.BytesIO(raw)) as bitmap:
                      dimensions.append(bitmap.size)
              assert dimensions, f"{name}: no embedded texture found"
              max_dimension = max(max(w, h) for w, h in dimensions)
              assert max_dimension in (2048, 4096), f"{name}: expected 2K/4K textures, found {dimensions}"
              print(f"{name}: {path.stat().st_size:,} bytes; texture dimensions {dimensions}")
          PY

      - name: Commit selected assets
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > "Mô hình 3D Vĩnh Tràng/Tượng/README.md" <<'EOF'
          # Tượng La Hán — Chùa Vĩnh Tràng

          Chỉ đưa vào game ba mẫu tiêu biểu để giữ hiệu năng và không làm dày đặc lối đi:
          - Kỵ Tượng La Hán — voi trắng
          - Tọa Lộc La Hán — hươu
          - Phục Hổ La Hán — hổ trắng

          Đây là các GLB đã có trong tài khoản Meshy, không phát sinh lượt tạo mới khi import.
          Geometry dùng Meshy T2; texture dùng Meshy 7. GitHub Actions kiểm tra GLB và xác nhận texture 2K hoặc 4K trước khi commit.
          EOF
          git add "Mô hình 3D Vĩnh Tràng/Tượng/ky-tuong-la-han.glb" "Mô hình 3D Vĩnh Tràng/Tượng/toa-loc-la-han.glb" "Mô hình 3D Vĩnh Tràng/Tượng/phuc-ho-la-han.glb" "Mô hình 3D Vĩnh Tràng/Tượng/README.md"
          git commit -m "Add three selected Vinh Trang Arhat GLB assets"
          git push origin HEAD:main
